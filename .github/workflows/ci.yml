name: CI

# Builds the app for the iOS Simulator and runs the unit and UI test targets on
# every push and pull request against the default branch. No signing material is
# used here, so this workflow passes on forks and on pull requests from branches
# where the App Store Connect secrets are not configured.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Untitled1.xcodeproj
  SCHEME: Untitled1
  XCODE_VERSION: '27.1'

jobs:
  build-and-test:
    name: Build and test (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show the toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Cache Swift Package dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ${{ runner.temp }}/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve package dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Select an available iOS simulator
        run: |
          set -euo pipefail
          python3 - <<'PY' > sim_name.txt
          import json
          import subprocess
          import sys

          listing = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              check=True,
              capture_output=True,
              text=True,
          )
          devices = json.loads(listing.stdout)["devices"]
          for runtime in sorted(devices, reverse=True):
              if ".iOS-" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["name"])
                      sys.exit(0)
          sys.exit("No available iOS simulator on this runner")
          PY
          SIM_NAME="$(head -n 1 sim_name.txt)"
          echo "Selected simulator: $SIM_NAME"
          echo "SIM_DESTINATION=platform=iOS Simulator,name=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Build for the iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$SIM_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Run unit and UI tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$SIM_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

  protocol-suites:
    # The XCTest job above runs the protocol suites inside the app; this job runs
    # the repository's own off-device harness, which is where the evidence in
    # INTEROP_REPORT.md comes from. Two checks need the app bundle's Keychain and
    # cannot pass in a plain `swiftc` binary; they run in the XCTest job instead
    # and are named here so this job stays green for the right reason.
    name: Protocol suites (off-device harness)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Compile the harness
        run: |
          set -euo pipefail
          mkdir -p .probe-build
          swiftc -swift-version 5 -o .probe-build/selftestprobe \
            Untitled1/I2P/*.swift SelfTestProbe/main.swift

      - name: Run every suite
        run: |
          set -uo pipefail
          ./.probe-build/selftestprobe --all > probe.log 2>&1
          status=$?
          tail -n 30 probe.log

          if ! grep -qE '^[0-9]+ passed, [0-9]+ failed$' probe.log; then
            echo "::error::The harness did not finish; see the log above."
            exit 1
          fi

          unexpected="$(grep '^FAIL' probe.log \
            | grep -v 'SAM persistent key store migrates legacy files into Keychain' \
            | grep -v 'SAM session persistence (save/restore private keys)' || true)"
          if [ -n "$unexpected" ]; then
            printf '::error::Unexpected failing check(s): %s\n' "$unexpected"
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Only the two app-bundle Keychain checks failed; they are covered by the Build and test job."
          fi

      - name: Upload the harness log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-suite-log
          path: probe.log
          if-no-files-found: ignore
          retention-days: 14
